# Hooks run on `git commit`, wired in by `pre-commit install` in
# postCreateCommand, and by the repository's CI on every pull request, which
# skips betterleaks there: its own job scans the commits. betterleaks is the
# binary the Dockerfile installs, not an upstream hook, which would download a
# Go toolchain and build it on the first commit.
# Docs: https://pre-commit.com/#repository-local-hooks
repos:
  - repo: local
    hooks:
      - id: betterleaks
        name: betterleaks
        entry: betterleaks git --pre-commit --staged --redact --verbose
        language: system
        pass_filenames: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
      # devcontainer.json is JSON with comments.
      - id: check-json
        exclude: ^\.devcontainer/devcontainer\.json$

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: [--severity=warning]
        # ShellCheck does not support zsh.
        exclude: \.zsh$
